[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ds-director"
version = "0.2.0"
description = "Director-led, tests-first delegation to CodeBuddy CLI"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
dsd = "dsd.cli:main"

[tool.setuptools]
packages = ["dsd"]
include-package-data = true

[tool.setuptools.package-data]
dsd = ["prompts/*.md"]
